# web/ served at /install/, with base.conf, installer.conf and general.conf
# copied to installer/ in the nginx configuration directory. Leave out test/,
# nginx/ and serve.py. .mjs files must be served as text/javascript.

location = /install/ {
    include installer/base.conf;
    include installer/installer.conf;
    add_header Cache-Control "public, no-cache";
    try_files /install/index.html =404;
}

location = /install/index.html {
    include installer/base.conf;
    include installer/installer.conf;
    add_header Cache-Control "public, no-cache";
}

location /install/ {
    include installer/base.conf;
    include installer/general.conf;
    add_header Cache-Control "public, no-cache";
}

# Versioned by the fastboot.js commit in the path.
location /install/js/fastboot/ {
    include installer/base.conf;
    include installer/general.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
