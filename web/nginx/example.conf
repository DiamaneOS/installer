# The web installer at /install/web/ on the website, as GrapheneOS serves its
# installer. Add these locations to the website's HTTPS server and copy
# base.conf, installer.conf and general.conf to installer/ in the nginx
# configuration directory. The website root holds web/ without nginx/, test/
# and serve.py at install/web/.

# The page's relative links need the trailing slash.
location = /install/web { return 301 /install/web/; }

location ^~ /install/web/ {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
    # Browsers refuse a module served with another type.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json map;
        font/woff2 woff2;
    }
    default_type text/plain;
    charset utf-8;

    # add_header in a location drops the server's, so each location includes all.
    include installer/base.conf;
    include installer/general.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;

    location = /install/web/ {
        include installer/base.conf;
        include installer/installer.conf;
        add_header Cache-Control "no-cache" always;
        try_files /install/web/index.html =404;
    }

    location = /install/web/index.html {
        include installer/base.conf;
        include installer/installer.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Versioned by the fastboot.js commit in the path.
    location ^~ /install/web/js/fastboot/ {
        include installer/base.conf;
        include installer/general.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
